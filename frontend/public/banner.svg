<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="0" x2="0" y2="630" stroke="white" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="630" stroke="white" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="630" stroke="white" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="630" stroke="white" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="630" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="white" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="630" stroke="white" stroke-width="1"/>
    <line x1="420" y1="0" x2="420" y2="630" stroke="white" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="630" stroke="white" stroke-width="1"/>
    <line x1="540" y1="0" x2="540" y2="630" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="1"/>
    <line x1="660" y1="0" x2="660" y2="630" stroke="white" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="630" stroke="white" stroke-width="1"/>
    <line x1="780" y1="0" x2="780" y2="630" stroke="white" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="630" stroke="white" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="white" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1020" y1="0" x2="1020" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1080" y1="0" x2="1080" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1140" y1="0" x2="1140" y2="630" stroke="white" stroke-width="1"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="white" stroke-width="1"/>
    <line x1="0" y1="63" x2="1200" y2="63" stroke="white" stroke-width="1"/>
    <line x1="0" y1="126" x2="1200" y2="126" stroke="white" stroke-width="1"/>
    <line x1="0" y1="189" x2="1200" y2="189" stroke="white" stroke-width="1"/>
    <line x1="0" y1="252" x2="1200" y2="252" stroke="white" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="white" stroke-width="1"/>
    <line x1="0" y1="378" x2="1200" y2="378" stroke="white" stroke-width="1"/>
    <line x1="0" y1="441" x2="1200" y2="441" stroke="white" stroke-width="1"/>
    <line x1="0" y1="504" x2="1200" y2="504" stroke="white" stroke-width="1"/>
    <line x1="0" y1="567" x2="1200" y2="567" stroke="white" stroke-width="1"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="950" cy="120" r="200" fill="white" opacity="0.06"/>
  <circle cx="1050" cy="500" r="160" fill="white" opacity="0.05"/>
  <circle cx="150" cy="520" r="120" fill="white" opacity="0.04"/>

  <!-- Shopping bag icon -->
  <g transform="translate(900, 315) scale(1.8)">
    <path d="M -60 -30 L -60 60 A 8 8 0 0 0 -52 68 L 52 68 A 8 8 0 0 0 60 60 L 60 -30 Z"
          fill="white" opacity="0.15"/>
    <path d="M -35 -30 A 35 35 0 0 1 35 -30"
          fill="none" stroke="white" opacity="0.15" stroke-width="14" stroke-linecap="round"/>
    <g transform="translate(0, 10)">
      <circle cx="-18" cy="0" r="20" fill="white" opacity="0.2"/>
      <text x="-18" y="8" font-family="Arial, sans-serif" font-size="22" font-weight="bold"
            fill="#4f46e5" text-anchor="middle">$</text>
    </g>
  </g>

  <!-- Tag icons scattered -->
  <g transform="translate(1050, 200) rotate(15)" opacity="0.12">
    <rect x="-30" y="-15" width="60" height="30" rx="8" fill="white"/>
    <circle cx="22" cy="0" r="8" fill="white"/>
  </g>
  <g transform="translate(800, 480) rotate(-10)" opacity="0.1">
    <rect x="-25" y="-12" width="50" height="24" rx="6" fill="white"/>
    <circle cx="18" cy="0" r="6" fill="white"/>
  </g>

  <!-- Main text -->
  <text x="80" y="220" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900"
        fill="white" letter-spacing="-1">
    TRADEGRID
  </text>

  <!-- Accent line -->
  <rect x="80" y="240" width="120" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- Tagline -->
  <text x="80" y="300" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400"
        fill="white" opacity="0.9">
    Buy &amp; Sell Pre-Owned Items
  </text>

  <text x="80" y="345" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"
        fill="white" opacity="0.65">
    Great deals, near you. No middlemen.
  </text>

  <!-- Stats row -->
  <g transform="translate(80, 400)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800"
          fill="white">100+</text>
    <text x="0" y="28" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400"
          fill="white" opacity="0.6">Live listings</text>

    <text x="160" y="0" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800"
          fill="white">Free</text>
    <text x="160" y="28" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400"
          fill="white" opacity="0.6">To list &amp; chat</text>

    <text x="310" y="0" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800"
          fill="white">Direct</text>
    <text x="310" y="28" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400"
          fill="white" opacity="0.6">No middlemen</text>
  </g>

  <!-- URL badge -->
  <g transform="translate(80, 500)">
    <rect x="0" y="0" width="340" height="40" rx="20" fill="white" opacity="0.15"/>
    <text x="170" y="26" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600"
          fill="white" text-anchor="middle" opacity="0.9">
      tradegrid-marketplace.onrender.com
    </text>
  </g>
</svg>
