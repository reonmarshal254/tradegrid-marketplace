<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable icon with safe zone padding (80% content in center) -->
  <defs>
    <linearGradient id="gradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Full bleed background (no rounded corners for maskable) -->
  <rect width="512" height="512" fill="url(#gradMask)"/>
  
  <!-- Grid pattern (representing marketplace/trading) - scaled down for safe zone -->
  <g opacity="0.12" transform="translate(256, 256) scale(0.8)">
    <path d="M -160 -160 L 160 -160 L 160 160 L -160 160 Z" fill="none" stroke="white" stroke-width="20"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="white" stroke-width="20"/>
    <line x1="-160" y1="0" x2="160" y2="0" stroke="white" stroke-width="20"/>
  </g>
  
  <!-- Shopping bag icon - scaled down for safe zone -->
  <g transform="translate(256, 256) scale(0.85)">
    <!-- Bag body -->
    <path d="M -80 -40 L -80 100 A 10 10 0 0 0 -70 110 L 70 110 A 10 10 0 0 0 80 100 L 80 -40 Z" 
          fill="white" stroke="none"/>
    
    <!-- Bag handle -->
    <path d="M -50 -40 A 50 50 0 0 1 50 -40" 
          fill="none" stroke="white" stroke-width="22" stroke-linecap="round"/>
    
    <!-- Tag icon (representing secondhand/resale) -->
    <g transform="translate(0, 15)">
      <circle cx="-25" cy="0" r="30" fill="#4f46e5"/>
      <text x="-25" y="13" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
            fill="white" text-anchor="middle">$</text>
    </g>
  </g>
  
  <!-- Text badge at bottom - inside safe zone -->
  <g transform="translate(256, 410)">
    <rect x="-70" y="-20" width="140" height="40" rx="20" fill="white" opacity="0.95"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
          fill="#4f46e5" text-anchor="middle">TG</text>
  </g>
</svg>
